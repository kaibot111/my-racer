<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PolyRacer 2077</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* HUD Info */
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #0ff; /* Cyan text */
            pointer-events: none;
            font-weight: 800;
            font-size: 20px;
            text-shadow: 0 0 10px #0ff;
            z-index: 10;
            display: none; /* Hidden until game starts */
        }

        /* iOS Liquid Glass Menu Container */
        #menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6); /* Dark backdrop */
            z-index: 20;
            transition: opacity 0.5s ease;
        }

        /* The Glass Card */
        .glass-panel {
            width: 400px;
            padding: 40px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05); /* Very subtle fill */
            backdrop-filter: blur(25px) saturate(180%); /* heavy blur */
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
        }

        h1 {
            margin-top: 0;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .mode-btn {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin: 15px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            border-color: #0ff;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    
    <div id="info">WAITING FOR SERVER...</div>

    <div id="menu-overlay">
        <div class="glass-panel">
            <h1>POLYRACER<br><span style="font-size:0.6em; color:#0ff;">NEON EDITION</span></h1>
            <p style="opacity: 0.7; margin-bottom: 30px;">Select Game Mode</p>
            
            <button class="mode-btn" onclick="startGame('arcade')">ARCADE RACE</button>
            <button class="mode-btn" onclick="startGame('drift')">CYBER DRIFT</button>
            <button class="mode-btn" onclick="startGame('free')">FREE ROAM</button>
        </div>
    </div>

    <script src="game.js"></script>
    
    <script>
        // Simple bridge to Game Logic
        function startGame(mode) {
            const menu = document.getElementById('menu-overlay');
            const hud = document.getElementById('info');
            
            menu.classList.add('hidden');
            hud.style.display = 'block';

            // Signal game.js that we are ready
            if(window.initGameLogic) {
                window.initGameLogic(mode);
            }
        }
    </script>
</body>
</html>
